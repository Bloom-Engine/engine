max_cpu_frame_p95_ms = 12.0
max_gpu_frame_p95_ms = 30.0
max_vram_peak_mb = 3400

[[case.assets]]
path = "examples/quality-transparency/assets/transparent-quad.gltf"
sha256 = "80c559c0a8a100f55fb5a26b331fa239751e0a1e66cc3b369d86bdff1d00acae"
source = "Bloom Engine generated qualification fixture"
license = "CC0 1.0"

[[case]]
id = "masked-alpha-coverage"
description = "48 moving imported MASK cards spanning six projected mip ranges with cutout shadows"
resolution = [960, 540]
warmup_frames = 120
measured_frames = 240
seed = 0
fixed_timestep = 0.016666666667
render_scale = 1.0
quality_tier = "high"
required_intermediates = [
  "hdr-scene",
  "scene-depth",
  "ssr",
  "ssr-raw",
  "ssr-rejection-reason",
  "ssr-temporal-confidence",
  "ssgi",
  "ssgi-rejection-reason",
  "ssgi-temporal-confidence",
  "shadow-cascade-0",
  "shadow-cascade-1",
  "shadow-cascade-2",
  "taa-rejection-reason",
  "taa-motion",
  "taa-reprojected-uv",
  "taa-temporal-confidence",
]

[case.camera]
position = [0.0, 5.0, 10.0]
target = [0.0, -0.3, -4.0]
up = [0.0, 1.0, 0.0]
fov_y_degrees = 52.0
animation = "six separated LOD bands of cutout cards sway deterministically at fixed 1/60 s"

[case.settings]
quality_preset = 3
taa = true
auto_exposure = false
shadows = true
masked_draw_count = 48
masked_alpha_minification = "coverage-mips-bayer-4x4"
sample_count = 1
alpha_to_coverage = false
present_mode = "auto-no-vsync"

[case.capture]
working_dir = "examples/quality-masked"
build = [
  "python3",
  "{repo}/tools/quality/build_example.py",
  "{repo}/examples/quality-masked",
]
command = [
  "./main", "--quality-preset", "3", "--render-scale", "{render_scale}",
  "--quality-run", "{warmup_frames}", "{measured_frames}", "{fixed_timestep}",
  "{candidate}", "{telemetry}", "{intermediates}",
]

[case.reference]
path = "tools/quality/baselines/portable/masked-alpha-coverage.png"
kind = "approved-realtime-motion"
generation = "tools/quality/run.py baseline-review"

[case.thresholds]
pixel_tolerance = 0.025
min_ssim = 0.97
max_rmse = 0.04
max_oklab_delta = 0.04
max_edge_delta = 0.04

[case.budgets]
machine_class = "apple-m1-max-metal"
max_cpu_frame_p95_ms = 12.0
max_gpu_frame_p95_ms = 30.0
max_vram_peak_mb = 3400

[[case.assets]]
path = "examples/quality-masked/assets/masked-card.gltf"
sha256 = "6e442fa8754905ec25d82f42d6180aef31bbd111ef08a4e1f91dd642fad8a110"
source = "Bloom Engine generated qualification fixture"
license = "CC0 1.0"

[[negative_control]]
fault = "brdf-energy"
case = "pbr-spheres-high"

[[negative_control]]
fault = "shadow-placement"
case = "sponza-interior"

[[negative_control]]
fault = "gi-leakage"
case = "sponza-interior"

[[negative_control]]
fault = "motion-history"
case = "skinned-alpha-motion"

[[negative_control]]
fault = "texture-orientation"
case = "damaged-helmet"
