schema_version = 1

[workflow]
quick = ["pbr-spheres-high", "damaged-helmet", "sponza-interior"]
full = [
  "pbr-spheres-high",
  "pbr-spheres-constrained",
  "damaged-helmet",
  "sponza-interior",
  "bistro-exterior",
  "skinned-alpha-motion",
  "draw-light-stress",
  "weighted-transparency",
  "masked-alpha-coverage",
]

[reproducibility]
# Pixel bounds are deliberately much tighter than the regression thresholds:
# deterministic raster cases are byte-identical, while the hardware ray-query
# cases may differ by a handful of sub-LSB temporal samples.
pixel_tolerance = 0.002
min_ssim = 0.999
max_rmse = 0.002
max_oklab_delta = 0.001
max_edge_delta = 0.001
# Mean timings are the stable throughput signal. P95 remains the hard budget
# signal, but receives a wider same-machine noise envelope because OS/GPU
# scheduling can move a few frames into or out of the 95th percentile.
max_cpu_mean_relative_delta = 0.15
max_cpu_mean_absolute_delta_ms = 0.35
max_gpu_mean_relative_delta = 0.15
max_gpu_mean_absolute_delta_ms = 1.0
max_cpu_p95_relative_delta = 0.25
max_cpu_p95_absolute_delta_ms = 1.0
max_gpu_p95_relative_delta = 0.50
max_gpu_p95_absolute_delta_ms = 12.0

[[machine_class]]
id = "apple-m1-max-metal"
description = "High-end Apple Silicon desktop/laptop baseline, Metal"
hard_gate = true
hard_metrics = ["cpu", "gpu"]
os = "macos"
backend = "metal"
gpu = "Apple M1 Max"

[[machine_class]]
id = "nvidia-rtx4080-vulkan"
description = "High-end discrete desktop baseline, Vulkan"
hard_gate = true
hard_metrics = ["cpu", "gpu", "vram"]
os = "linux"
backend = "vulkan"
gpu = "NVIDIA GeForce RTX 4080"

[[machine_class]]
id = "apple-m1-metal-constrained"
description = "Constrained quality tier executed on Apple M1-class Metal"
hard_gate = true
hard_metrics = ["cpu", "gpu"]
os = "macos"
backend = "metal"
gpu = "Apple M1"

[[case]]
id = "pbr-spheres-high"
description = "BRDF energy, Fresnel, metallic/roughness lobes, and IBL orientation"
resolution = [512, 512]
warmup_frames = 120
measured_frames = 300
seed = 0
fixed_timestep = 0.016666666667
render_scale = 1.0
quality_tier = "high"
required_intermediates = [
  "hdr-scene",
  "scene-depth",
  "ssr",
  "ssr-raw",
  "ssr-rejection-reason",
  "ssr-temporal-confidence",
  "ssgi",
  "ssgi-rejection-reason",
  "ssgi-temporal-confidence",
  "shadow-cascade-0",
  "shadow-cascade-1",
  "shadow-cascade-2",
  "taa-rejection-reason",
  "taa-motion",
  "taa-reprojected-uv",
  "taa-temporal-confidence",
]

[case.camera]
position = [0.0, 0.0, 7.0]
target = [0.0, 0.0, 0.0]
up = [0.0, 1.0, 0.0]
fov_y_degrees = 45.0
animation = "still"

[case.settings]
quality_preset = 3
taa = true
auto_exposure = false
present_mode = "auto-no-vsync"

[case.capture]
working_dir = "examples/pbr-spheres"
build = ["python3", "{repo}/tools/quality/build_example.py", "{repo}/examples/pbr-spheres"]
command = [
  "./main",
  "--camera", "{camera_px}", "{camera_py}", "{camera_pz}",
  "{camera_tx}", "{camera_ty}", "{camera_tz}", "{camera_fov}",
  "--res", "{width}", "{height}",
  "--quality-preset", "3", "--render-scale", "{render_scale}",
  "--quality-run", "{warmup_frames}", "{measured_frames}", "{fixed_timestep}",
  "{candidate}", "{telemetry}", "{intermediates}",
]

[case.reference]
path = "tools/quality/baselines/portable/pbr-spheres-high.png"
kind = "approved-realtime"
generation = "tools/quality/run.py baseline-review"

[case.thresholds]
pixel_tolerance = 0.02
min_ssim = 0.985
max_rmse = 0.025
max_oklab_delta = 0.025
max_edge_delta = 0.025

[case.budgets]
machine_class = "apple-m1-max-metal"
max_cpu_frame_p95_ms = 5.0
max_gpu_frame_p95_ms = 20.0
max_vram_peak_mb = 1600

[[case.assets]]
path = "examples/renderer-test/assets/outdoor.hdr"
sha256 = "fd94c84997b8a3c353b62c2125a9b44e19509956986a126e472684432a02d798"
source = "https://polyhaven.com/a/venice_sunset"
license = "CC0 1.0"

